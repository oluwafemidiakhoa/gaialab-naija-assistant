name: Trust Dashboard Contracts

on:
  push:
    paths:
      - "src/trust_dashboard.py"
      - "src/trust_dashboard_data.py"
      - "src/operator_auth.py"
      - "scripts/manage_neon_trust.py"
      - "scripts/manage_trust_identity.py"
      - "tests/test_trust_dashboard.py"
      - ".github/workflows/trust-dashboard-ci.yml"
  pull_request:
    paths:
      - "src/trust_dashboard.py"
      - "src/trust_dashboard_data.py"
      - "src/operator_auth.py"
      - "scripts/manage_neon_trust.py"
      - "scripts/manage_trust_identity.py"
      - "tests/test_trust_dashboard.py"
      - ".github/workflows/trust-dashboard-ci.yml"

jobs:
  dashboard-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: >-
          python -m pip install
          "pytest>=8,<10"
          "streamlit>=1.41,<2"
          "pandas>=2,<4"
          "cryptography>=44,<47"
          "psycopg[binary]>=3.2,<4"
      - name: Run dashboard contracts
        run: python -m pytest -q tests/test_trust_dashboard.py
      - name: Compile dashboard and provisioning modules
        run: >-
          python -m py_compile
          src/trust_dashboard.py
          src/trust_dashboard_data.py
          scripts/manage_neon_trust.py
          scripts/manage_trust_identity.py

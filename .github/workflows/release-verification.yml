name: Release verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "data/releases/**"
      - "src/release_verification.py"
      - "src/model_verification.py"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
      - run: pip install -r requirements-cpu.txt
      - run: python scripts/dataset_platform.py verify --version v0.6
      - name: Verify public certificate privacy
        run: python -m pytest tests/test_release_verification.py tests/test_model_verification.py
      - run: git diff --exit-code -- data/releases data/registry

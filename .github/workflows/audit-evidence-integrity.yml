name: Audit Evidence Integrity

on:
  push:
    paths:
      - "src/audit_export.py"
      - "src/receipt_store.py"
      - "src/receipt_signing.py"
      - "tests/test_audit_export.py"
      - ".github/workflows/audit-evidence-integrity.yml"
  pull_request:
    paths:
      - "src/audit_export.py"
      - "src/receipt_store.py"
      - "src/receipt_signing.py"
      - "tests/test_audit_export.py"
      - ".github/workflows/audit-evidence-integrity.yml"

jobs:
  audit-evidence-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: >-
          python -m pip install
          "pytest>=8,<10"
          "cryptography>=44,<47"
      - name: Run audit evidence tamper contracts
        run: python -m pytest -q tests/test_audit_export.py
      - name: Compile audit evidence modules
        run: python -m py_compile src/audit_export.py src/receipt_store.py src/receipt_signing.py

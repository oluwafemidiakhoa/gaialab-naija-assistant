name: Provider Adapter Contracts

on:
  pull_request:
    paths:
      - "src/provider_adapters.py"
      - "src/provider_sdk_wrappers.py"
      - "src/claim_extraction.py"
      - "src/claim_reconciliation.py"
      - "src/trust_engine.py"
      - "src/trust_api.py"
      - "tests/test_provider_adapters.py"
      - "tests/test_provider_sdk_wrappers.py"
      - ".github/workflows/provider-adapters.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: >-
          python -m pip install
          "pytest>=8,<10"
          "fastapi>=0.115,<1"
          "pydantic>=2,<3"
          "cryptography>=44,<47"
          "psycopg[binary]>=3.2,<4"
      - name: Run provider adapter contracts
        run: >-
          python -m pytest -q
          tests/test_provider_adapters.py
          tests/test_provider_sdk_wrappers.py
      - name: Compile provider boundaries
        run: >-
          python -m py_compile
          src/provider_adapters.py
          src/provider_sdk_wrappers.py

name: Naija Language Benchmarks

on:
  pull_request:
    paths:
      - "src/claim_extraction.py"
      - "src/claim_reconciliation.py"
      - "src/trust_api.py"
      - "evaluation/claim_extraction_benchmark.py"
      - "evaluation/fixtures/naija_pidgin_*.jsonl"
      - "tests/test_naija_*.py"
      - ".github/workflows/naija-language-benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: >-
          python -m pip install
          "pytest>=8,<10"
          "fastapi>=0.115,<1"
          "pydantic>=2,<3"
          "cryptography>=44,<47"
          "httpx>=0.27,<1"
          "psycopg[binary]>=3.2,<4"
      - name: Run Nigerian English and Pidgin tests
        run: >-
          python -m pytest -q
          tests/test_naija_claim_extraction.py
          tests/test_naija_pidgin_trust.py
      - name: Run exact-match extraction benchmark
        run: python evaluation/claim_extraction_benchmark.py
